name: Aufräumen (alte Releases löschen)

# Einmal-Knopf: Actions → „Aufräumen (alte Releases löschen)“ → Run workflow.
# Erst „probelauf“ = zeigt nur, was gelöscht würde. Dann „loeschen“ = löscht wirklich
# (Release + Tag). Die Liste KEEP (10 Meilensteine) bleibt immer stehen, dazu die neueste Version.

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "probelauf = nur anzeigen, loeschen = wirklich löschen"
        type: choice
        options: [probelauf, loeschen]
        default: probelauf

permissions:
  contents: write

jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MODUS: ${{ inputs.modus }}
      KEEP: >-
        v1.0.0 v1.6.0 v2.3.0 v2.10.0 v2.21.2 v2.26.0 v2.35.0 v2.40.0 v2.43.0 v2.44.0
    steps:
      - name: Releases und Tags aufräumen
        run: |
          set -euo pipefail
          keep=" $KEEP "
          # die neueste Version bleibt immer, egal was in KEEP steht
          latest=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          keep="$keep $latest "
          echo "Bleibt stehen: $keep"
          weg=0
          for tag in $(gh release list --repo "$REPO" --limit 500 --json tagName -q '.[].tagName'); do
            case "$keep" in *" $tag "*) continue ;; esac
            weg=$((weg+1))
            if [ "$MODUS" = "loeschen" ]; then
              echo "🗑️  lösche Release $tag"
              gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
            else
              echo "würde löschen: Release $tag"
            fi
          done
          # übrig gebliebene Tags ohne Release (nur v…)
          for tag in $(gh api "repos/$REPO/git/matching-refs/tags/v" --paginate -q '.[].ref' | sed 's#refs/tags/##'); do
            case "$keep" in *" $tag "*) continue ;; esac
            if [ "$MODUS" = "loeschen" ]; then
              echo "🗑️  lösche Tag $tag"
              gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" || true
            else
              echo "würde löschen: Tag $tag (falls ohne Release)"
            fi
          done
          echo "Fertig – $weg Releases betroffen (Modus: $MODUS)."
