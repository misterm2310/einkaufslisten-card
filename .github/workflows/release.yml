name: Release automatisch anlegen

# Sobald die Version in manifest.json erhöht wird, legt GitHub selbst ein
# Release an (z. B. v1.1.5). HACS zeigt dann diese Versionsnummer an.
# Erst NACHDEM „Prüfen“ (HACS, hassfest, Tests) grün durchgelaufen ist –
# so will es HACS für die Aufnahme in die offizielle Liste.
on:
  workflow_run:
    workflows: ["Prüfen"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SHA }}

      - name: Version auslesen
        id: version
        run: echo "tag=v$(jq -r .version custom_components/einkaufsliste/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Release anlegen (nur wenn es die Version noch nicht gibt)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – nichts zu tun."
          else
            # 📝 Kurze deutsche Beschreibung: die Commit-Texte seit dem letzten Release
            PREV=$(git describe --tags --abbrev=0 "$SHA^" 2>/dev/null || true)
            RANGE=${PREV:+$PREV..}$SHA
            {
              echo "## Was ist neu"
              git log "$RANGE" --no-merges --pretty=format:'- %s'
              echo
              [ -n "$PREV" ] && echo "**Alle Änderungen:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            } > notes.md
            if ! grep -q "^- " notes.md; then
              gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
            else
              gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file notes.md
            fi
          fi
