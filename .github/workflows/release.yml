name: Release automatisch anlegen

# Sobald die Version in manifest.json erhöht wird, legt GitHub selbst ein
# Release an (z. B. v1.1.5). HACS zeigt dann diese Versionsnummer an.
# Erst NACHDEM „Prüfen“ (HACS, hassfest, Tests) grün durchgelaufen ist –
# so will es HACS für die Aufnahme in die offizielle Liste.
on:
  workflow_run:
    workflows: ["Prüfen"]
    types: [completed]
    branches: [main, beta]   # 🧪 „beta“ = Testversionen (Vorabversion, nur für HACS „Beta-Versionen anzeigen“)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SHA }}

      - name: Version auslesen
        id: version
        run: echo "tag=v$(jq -r .version custom_components/einkaufsliste/manifest.json)" >> "$GITHUB_OUTPUT"

      # 📥 Download-Zahl für die Credits: Summe aller ZIP-Downloads aller Releases bis jetzt.
      # Überschreibt den Platzhalter www/downloads.json (im Repo: 0 = keine Zeile) NUR in der ZIP – die Karte liest sie offline, ohne GitHub zu fragen.
      - name: Download-Zahl in die ZIP schreiben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '[.[].assets[] | select(.name | endswith(".zip")) | .download_count] | add // 0' | awk '{s+=$1} END {print s+0}') || N=0
          echo "{\"downloads\": ${N:-0}, \"stand\": \"$(date -u +%F)\"}" > custom_components/einkaufsliste/www/downloads.json
          cat custom_components/einkaufsliste/www/downloads.json

      # 📦 Fertig gepackte ZIP für HACS/Marketplace (hacs.json: zip_release + filename).
      # Inhalt = der Ordner custom_components/einkaufsliste OHNE Unterordner (manifest.json liegt ganz oben),
      # denn HACS packt die ZIP direkt nach config/custom_components/einkaufsliste/ aus.
      # GitHub zählt die Downloads dieser Datei → Download-Schild im README.
      - name: ZIP packen
        run: |
          rm -f einkaufsliste.zip
          (cd custom_components/einkaufsliste && zip -r -q -X ../../einkaufsliste.zip . -x '*__pycache__*' '*.pyc')
          unzip -l einkaufsliste.zip | tail -n 1
          # Sicherung: manifest.json muss ganz oben liegen, sonst findet HA die Integration nicht
          unzip -l einkaufsliste.zip | awk '{print $4}' | grep -qx 'manifest.json'

      - name: Release anlegen (nur wenn es die Version noch nicht gibt)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          # 🧪 Sicherung: Auf „beta“ nur Versionen mit -beta, auf „main“ nie eine -beta
          PRE=""
          case "$TAG" in *-beta*) PRE="--prerelease";; esac
          if [ "$BRANCH" = "beta" ] && [ -z "$PRE" ]; then echo "Auf beta nur -beta-Versionen – nichts zu tun."; exit 0; fi
          if [ "$BRANCH" != "beta" ] && [ -n "$PRE" ]; then echo "-beta gehört auf den Zweig beta – nichts zu tun."; exit 0; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 📦 Release gibt es schon: fehlt die ZIP (z. B. Lauf abgebrochen), wird sie nachgereicht
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx 'einkaufsliste.zip'; then
              echo "Release $TAG gibt es schon (mit ZIP) – nichts zu tun."
            else
              gh release upload "$TAG" einkaufsliste.zip
            fi
          else
            # 📝 Kurze deutsche Beschreibung: die Commit-Texte seit dem letzten Release
            PREV=$(git describe --tags --abbrev=0 --exclude '*-beta*' "$SHA^" 2>/dev/null || true)
            RANGE=${PREV:+$PREV..}$SHA
            {
              echo "## Was ist neu"
              git log "$RANGE" --no-merges --pretty=format:'- %s'
              echo
              [ -n "$PREV" ] && echo "**Alle Änderungen:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            } > notes.md
            if ! grep -q "^- " notes.md; then
              gh release create "$TAG" einkaufsliste.zip --target "$SHA" --title "$TAG" $PRE --generate-notes
            else
              gh release create "$TAG" einkaufsliste.zip --target "$SHA" --title "$TAG" $PRE --notes-file notes.md
            fi
          fi
