add_item:
  fields:
    name:
      required: true
      example: "Milch"
      selector:
        text:
    store:
      example: "Aldi"
      selector:
        text:
    category:
      example: "Kühlregal & Milch"
      selector:
        text:
    quantity:
      example: "2 Liter"
      selector:
        text:
    note:
      example: "Bio"
      selector:
        text:
    for_whom:
      example: "Oma"
      selector:
        text:
    added_by:
      example: "Oma"
      selector:
        text:
    create_missing:
      default: false
      selector:
        boolean:

get_items:
  fields:
    status:
      default: "open"
      selector:
        select:
          options:
            - "open"
            - "checked"
            - "history"
          translation_key: get_status
    store:
      example: "Aldi"
      selector:
        text:

