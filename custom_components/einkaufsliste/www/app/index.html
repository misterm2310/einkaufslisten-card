<html lang="de">
<head>

<title>Einkaufsliste</title>
<style>
/* Farben wie in Home Assistant – die Karte nutzt genau diese Variablen */
:root {
  --primary-color:#03a9f4; --accent-color:#ff9800; --primary-text-color:#212121; --secondary-text-color:#727272;
  --text-primary-color:#fff; --disabled-text-color:#bdbdbd; --divider-color:rgba(0,0,0,.12);
  --primary-background-color:#fafafa; --secondary-background-color:#e5e5e5; --card-background-color:#fff;
  --ha-card-background:#fff; --ha-card-border-radius:12px; --error-color:#db4437; --warning-color:#ffa600;
  --success-color:#43a047; --info-color:#039be5; --state-icon-color:#44739e; --mdc-theme-primary:#03a9f4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --divider-color:rgba(225,225,225,.12);
    --primary-background-color:#111111; --secondary-background-color:#282828; --card-background-color:#1c1c1c;
    --ha-card-background:#1c1c1c; --state-icon-color:#9e9e9e; color-scheme: dark; }
}
/* 🌓 in der App gewählt: immer dunkel */
:root[data-theme="dark"] { --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --divider-color:rgba(225,225,225,.12);
  --primary-background-color:#111111; --secondary-background-color:#282828; --card-background-color:#1c1c1c;
  --ha-card-background:#1c1c1c; --state-icon-color:#9e9e9e; color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--primary-background-color); color:var(--primary-text-color);
  font:16px/1.4 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color:transparent; }
body { padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 24px); }
#wrap { max-width:720px; margin:0 auto; }
.bar { display:flex; align-items:center; gap:8px; margin:0 4px 8px; font-size:13px; color:var(--secondary-text-color); }
.bar .grow { flex:1; }
.pill { border-radius:999px; padding:2px 10px; background:color-mix(in srgb, var(--success-color) 18%, transparent); color:var(--primary-text-color); }
.pill.off { background:color-mix(in srgb, var(--error-color) 18%, transparent); }
.bar button { font:inherit; color:inherit; background:none; border:0; text-decoration:underline; cursor:pointer; }
.foot[hidden] { display:none; }
.foot { display:flex; justify-content:center; gap:10px; margin:28px 6px 8px; font-size:13px; color:var(--secondary-text-color); }
.foot button { font:inherit; color:inherit; background:none; text-decoration:underline; border:1px solid var(--divider-color); border-radius:10px; padding:8px 18px; cursor:pointer; }
.login { max-width:420px; margin:16vh auto 0; text-align:center; padding:0 20px; }
.login img { width:96px; height:96px; border-radius:22px; }
.big { font:inherit; border:0; background:var(--primary-color); color:#fff; border-radius:12px; padding:13px 22px; font-size:17px; font-weight:600; margin-top:16px; cursor:pointer; }
.small { font-size:13px; color:var(--secondary-text-color); }
/* 📷 Scanner mit der Handykamera */
.scan { position:fixed; inset:0; z-index:10040; background:#000; color:#fff; display:flex; flex-direction:column; }
.scan video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.scan .shade { position:absolute; left:8%; right:8%; top:34%; height:26%; border-radius:16px; box-shadow:0 0 0 100vmax rgba(0,0,0,.55); border:3px solid #fff; }
.scan .shade::after { content:""; position:absolute; left:6%; right:6%; top:50%; height:2px; background:#ff5252; box-shadow:0 0 8px #ff5252; }
.scan .shade.hit { border-color:#66bb6a; }
.scan .top { position:relative; padding:calc(env(safe-area-inset-top) + 18px) 20px 0; text-align:center; }
.scan .top h2 { margin:0 0 6px; font-size:19px; }
.scan .top p { margin:0; color:#ddd; font-size:14px; }
.scan .msg { position:absolute; left:50%; top:63%; transform:translateX(-50%); background:rgba(30,30,30,.92); border-radius:12px; padding:9px 14px; font-size:15px; max-width:88vw; text-align:center; }
.scan .msg:empty { display:none; }
.scan .btns { position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 22px); display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:0 16px; }
.scan .btns button { font:inherit; font-size:16px; font-weight:600; border:0; border-radius:12px; padding:13px 18px; cursor:pointer; background:rgba(255,255,255,.18); color:#fff; }
.scan .btns button.main { background:var(--primary-color); }
.scan ~ .toast { bottom:calc(env(safe-area-inset-bottom) + 96px); }
.toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 20px); transform:translateX(-50%); background:#323232; color:#fff;
  border-radius:10px; padding:10px 16px; font-size:14px; max-width:90vw; z-index:10050; box-shadow:0 4px 16px rgba(0,0,0,.3); }
</style>

<body>
<div id="wrap"></div>
<script>
"use strict";
window.__elOfflineApp = true; // 📱 für die Karte: das hier ist unsere Offline-App, nicht die HA-App
// 🌓 Hell / Dunkel / Automatisch (in ⚙️ → App & Aussehen)
function applyTheme(v) {
  const t = v === "light" || v === "dark" ? v : "";
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const meta = document.querySelector('meta[name="theme-color"]');
  const dark = t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
  if (meta) meta.content = dark ? "#1c1c1c" : "#03a9f4";
}
try { applyTheme(localStorage.getItem("einkaufsliste_theme")); } catch (_) { applyTheme(""); }
window.addEventListener("einkaufsliste-theme", (e) => applyTheme(e.detail));
// 📱 Einkaufsliste – die Offline-App. Version __EL_VERSION__
// Hier läuft GENAU DIESELBE Karte wie im Dashboard. Diese Seite spielt nur „Home Assistant“ für sie:
// Anmeldung, Verbindung, und alles für ohne Netz (letzter Stand, Warteschlange, gemerkte Fotos).
const BASE = "/einkaufsliste/app/";
const CLIENT_ID = location.origin + BASE;
const VERSION = "__EL_VERSION__";
const K = { auth: "elapp_auth", data: "elapp_data", user: "elapp_user", states: "elapp_states" };
const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { /* Speicher voll oder privat */ } };
const EN = !String(navigator.language || "de").toLowerCase().startsWith("de");

// ---------------------------------------------------------------- 🔄 Kleiner Speicher, den auch der Hintergrund-Helfer (sw.js) lesen kann
// Darin: Warteschlange, Anmeldung, „wer schickt gerade“. So kann Android auch bei geschlossener App nachschicken.
const QKEY = "einkaufsliste_queue";
let dbp = null;
function db() {
  if (!("indexedDB" in window)) return Promise.reject(new Error("idb"));
  return dbp || (dbp = new Promise((ok, fail) => {
    const r = indexedDB.open("einkaufsliste-app", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => ok(r.result);
    r.onerror = () => { dbp = null; fail(r.error); };
  }));
}
async function kv(mode, fn) {
  const d = await db();
  return new Promise((ok, fail) => {
    const tx = d.transaction("kv", mode);
    const st = tx.objectStore("kv");
    let out;
    Promise.resolve(fn(st, (v) => { out = v; })).catch(fail);
    tx.oncomplete = () => ok(out);
    tx.onerror = () => fail(tx.error);
  });
}
const kvGet = (k) => kv("readonly", (st, set) => { const r = st.get(k); r.onsuccess = () => set(r.result); }).catch(() => undefined);
const kvSet = (k, v) => kv("readwrite", (st) => { st.put(v, k); }).catch(() => {});
const kvDel = (k) => kv("readwrite", (st) => { st.delete(k); }).catch(() => {});
// 🔐 Nur einer schickt gleichzeitig: diese Seite ODER der Hintergrund-Helfer
const ME = "page-" + Math.random().toString(36).slice(2, 8);
const lockTake = () => kv("readwrite", (st, set) => {
  const r = st.get("lock");
  r.onsuccess = () => {
    const l = r.result;
    if (l && l.owner !== ME && l.until > Date.now()) { set(false); return; }
    st.put({ owner: ME, until: Date.now() + 60000 }, "lock");
    set(true);
  };
}).catch(() => true);
const lockFree = () => kv("readwrite", (st) => {
  const r = st.get("lock");
  r.onsuccess = () => { if (r.result?.owner === ME) st.delete("lock"); };
}).catch(() => {});
// Stand der Warteschlange aus dem gemeinsamen Speicher holen (der Hintergrund-Helfer hat vielleicht schon nachgeschickt)
async function queueFromStore() {
  const q = await kvGet("queue");
  if (!Array.isArray(q)) return null;
  const flushed = await kvGet("flushed");
  if (flushed?.n) {
    await kvDel("flushed");
    setTimeout(() => toast(T(`✅ ${flushed.n} ${flushed.n === 1 ? "Änderung wurde" : "Änderungen wurden"} im Hintergrund nachgeschickt`,
      `✅ ${flushed.n} ${flushed.n === 1 ? "change was" : "changes were"} sent in the background`)), 300);
  }
  return q;
}
window.einkaufslisteFlushGate = {
  async acquire() {
    if (!(await lockTake())) return false;
    const q = await queueFromStore();
    if (q) window.einkaufslisteQueue?.replace(q);
    return true;
  },
  release() { lockFree(); },
};
window.addEventListener("einkaufsliste-queue", (e) => { kvSet("queue", e.detail || []); });
function askBackgroundSync() {
  let q = [];
  try { q = JSON.parse(localStorage.getItem(QKEY) || "[]"); } catch (_) { /* egal */ }
  if (!q.length || !("serviceWorker" in navigator)) return;
  navigator.serviceWorker.ready.then((reg) => reg.sync?.register("el-queue")).catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (document.hidden) askBackgroundSync(); });
window.addEventListener("pagehide", askBackgroundSync);
const T = (de, en) => (EN ? en : de);

// ---------------------------------------------------------------- 🔲 Bausteine, die sonst Home Assistant mitbringt
let ICONS = null;
const waiting = new Set();
fetch(BASE + "icons.json").then((r) => r.json()).then((j) => { ICONS = j; for (const el of waiting) el.draw(); waiting.clear(); }).catch(() => {});
class ElIcon extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  constructor() {
    super();
    this.attachShadow({ mode: "open" }).innerHTML = `<style>
      :host { display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; flex:0 0 auto;
        width:var(--mdc-icon-size, 24px); height:var(--mdc-icon-size, 24px); fill:currentColor; }
      :host([hidden]) { display:none; } svg { width:100%; height:100%; display:block; }</style><svg viewBox="0 0 24 24"><path></path></svg>`;
  }
  connectedCallback() { this.draw(); }
  attributeChangedCallback() { this.draw(); }
  draw() {
    const name = String(this.getAttribute("icon") || "").replace(/^mdi:/, "");
    if (!ICONS) { waiting.add(this); return; }
    this.shadowRoot.querySelector("path").setAttribute("d", ICONS[name] || "");
  }
}
if (!customElements.get("ha-icon")) customElements.define("ha-icon", ElIcon);
class ElCard extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: "open" }).innerHTML = `<style>:host { display:block; background:var(--ha-card-background, var(--card-background-color));
      border-radius:var(--ha-card-border-radius, 12px); box-shadow:0 1px 3px rgba(0,0,0,.12); color:var(--primary-text-color); }</style><slot></slot>`;
  }
}
if (!customElements.get("ha-card")) customElements.define("ha-card", ElCard);

// ---------------------------------------------------------------- 🔑 Anmeldung (wie die Home-Assistant-App)
let auth = get(K.auth, null);
async function tokenRequest(body) {
  const r = await fetch("/auth/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ client_id: CLIENT_ID, ...body }) });
  if (!r.ok) throw Object.assign(new Error("token " + r.status), { status: r.status });
  const j = await r.json();
  return { access: j.access_token, refresh: j.refresh_token || auth?.refresh, expires: Date.now() + (j.expires_in || 1800) * 1000 - 60000 };
}
function startLogin() {
  const state = Math.random().toString(36).slice(2);
  sessionStorage.setItem("elapp_state", state);
  try { localStorage.setItem("elapp_state", state); } catch (_) { /* egal */ } // iPhone: der Sitzungsspeicher kann beim Zurückkommen von der Anmeldung leer sein
  location.href = "/auth/authorize?" + new URLSearchParams({ response_type: "code", client_id: CLIENT_ID, redirect_uri: CLIENT_ID, state });
}
async function finishLogin() {
  const q = new URLSearchParams(location.search);
  if (!q.get("code")) return;
  history.replaceState(null, "", BASE);
  const savedState = sessionStorage.getItem("elapp_state") || (() => { try { return localStorage.getItem("elapp_state"); } catch (_) { return null; } })();
  if (!savedState || q.get("state") !== savedState) return; // ohne gemerkten Wert (null) nie durchlassen
  try { localStorage.removeItem("elapp_state"); } catch (_) { /* egal */ }
  auth = await tokenRequest({ grant_type: "authorization_code", code: q.get("code") });
  put(K.auth, auth); kvSet("auth", { ...auth, client_id: CLIENT_ID });
}
async function accessToken() {
  if (auth && auth.expires > Date.now()) return auth.access;
  auth = { ...(await tokenRequest({ grant_type: "refresh_token", refresh_token: auth.refresh })), refresh: auth.refresh };
  put(K.auth, auth); kvSet("auth", { ...auth, client_id: CLIENT_ID });
  return auth.access;
}

// ---------------------------------------------------------------- 🔌 Verbindung
let ws = null, ready = false, msgId = 1, retry = null;
const pending = new Map();
const subs = new Map(); // eigene Abo-Nummer -> { msg, cb, serverId }
let states = get(K.states, {}), user = get(K.user, null);
let lastData = get(K.data, null);

function connect() {
  clearTimeout(retry);
  if (!auth || (ws && ws.readyState <= 1)) return;
  if (navigator.onLine === false) { update(); return; }
  try { ws = new WebSocket(location.origin.replace(/^http/, "ws") + "/api/websocket"); } catch (_) { later(); return; }
  ws.onmessage = async (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "auth_required") {
      try { ws.send(JSON.stringify({ type: "auth", access_token: await accessToken() })); }
      catch (err) { if ([400, 401].includes(err.status)) logout(true); else ws.close(); } // 403 (Sperre, WLAN-Anmeldeseite) ist KEIN ungültiges Token – nicht abmelden
    } else if (m.type === "auth_invalid") {
      auth.expires = 0; put(K.auth, auth); kvSet("auth", { ...auth, client_id: CLIENT_ID }); ws.close();
    } else if (m.type === "auth_ok") {
      ready = true;
      for (const s of subs.values()) sendSub(s);
      loadUserAndStates();
      update();
    } else if (m.type === "event") {
      for (const s of subs.values()) if (s.serverId === m.id) s.onEvent(m.event);
    } else if (m.type === "result") {
      const p = pending.get(m.id);
      if (p) { pending.delete(m.id); m.success ? p.ok(m.result) : p.fail(m.error || {}); }
    }
  };
  ws.onclose = () => { ready = false; for (const p of pending.values()) p.fail({ code: "lost", message: T("📴 Keine Verbindung", "📴 No connection") }); pending.clear(); update(); later(); };
  ws.onerror = () => { try { ws.close(); } catch (_) { /* egal */ } };
}
function later() { clearTimeout(retry); retry = setTimeout(connect, 5000); }
function raw(msg) {
  return new Promise((ok, fail) => {
    if (!ready) { fail({ code: "lost", message: T("📴 Ohne Netz geht das gerade nicht", "📴 That needs a connection") }); return; }
    const id = msgId++;
    pending.set(id, { ok, fail });
    ws.send(JSON.stringify({ id, ...msg }));
  });
}
function sendSub(s) {
  s.serverId = msgId++;
  pending.set(s.serverId, { ok: () => {}, fail: (e) => s.onError?.(e) });
  ws.send(JSON.stringify({ id: s.serverId, ...s.msg }));
}
async function loadUserAndStates() {
  try { user = await raw({ type: "auth/current_user" }); put(K.user, user); } catch (_) { /* später */ }
  try {
    const all = await raw({ type: "get_states" });
    states = {};
    for (const st of all) if (/^(person|zone)\./.test(st.entity_id)) states[st.entity_id] = st;
    put(K.states, states);
    const ids = Object.keys(states);
    if (ids.length) {
      subs.set("ents", { msg: { type: "subscribe_entities", entity_ids: ids }, onEvent: (ev) => {
        for (const [id, v] of Object.entries(ev.a || {})) states[id] = { entity_id: id, state: v.s, attributes: v.a || {} };
        for (const [id, v] of Object.entries(ev.c || {})) {
          const old = states[id] || { entity_id: id, attributes: {} };
          const plus = v["+"] || {};
          states[id] = { ...old, state: plus.s ?? old.state, attributes: { ...old.attributes, ...(plus.a || {}) } };
        }
        put(K.states, states);
        update();
      } });
      sendSub(subs.get("ents"));
    }
  } catch (_) { /* später */ }
  update();
}
window.addEventListener("online", connect);
window.addEventListener("offline", () => { try { ws?.close(); } catch (_) { /* egal */ } update(); });
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) return;
  const q = await queueFromStore(); // erst abgleichen – vielleicht wurde im Hintergrund schon nachgeschickt
  if (q && window.einkaufslisteQueue && JSON.stringify(q) !== JSON.stringify(window.einkaufslisteQueue.get())) {
    window.einkaufslisteQueue.replace(q);
    if (card && lastData) card.hass = makeHass();
  }
  connect();
});

// ---------------------------------------------------------------- 🗄️ Ohne Netz: gemerkte Antworten (Fotos, Produkte, Verlauf …)
const READ_CACHE = new Set(["einkaufsliste/photo/get", "einkaufsliste/products", "einkaufsliste/log/get", "einkaufsliste/barcode/info", "einkaufsliste/import/todo_lists"]);
const cacheKey = (msg) => BASE + "__ws/" + encodeURIComponent(JSON.stringify(msg));
async function cachePut(msg, res) { try { const c = await caches.open("einkaufsliste-daten"); await c.put(cacheKey(msg), new Response(JSON.stringify(res), { headers: { "Content-Type": "application/json" } })); } catch (_) { /* egal */ } }
async function cacheGet(msg) { try { const c = await caches.open("einkaufsliste-daten"); const r = await c.match(cacheKey(msg)); return r ? r.json() : undefined; } catch (_) { return undefined; } }

// ---------------------------------------------------------------- 📷 Barcode-Scanner mit der Handykamera
// Die Karte kennt den Scanner der Home-Assistant-App. Diese Seite spielt genau diesen Scanner nach –
// so funktionieren alle Scan-Sachen der Karte (eintragen, mehrere scannen, im Laden abhaken, zuordnen).
// Android/Chrome hat einen Barcode-Leser eingebaut; sonst (z. B. iPhone) liest ZXing (Apache 2.0) die Bilder.
const FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "itf", "qr_code", "aztec"];
const EXT = {
  config: { hasBarCodeScanner: !!(window.isSecureContext && navigator.mediaDevices?.getUserMedia) },
  receiveMessage() {}, // wird von der Karte „angezapft“
  fireMessage(msg) {
    if (msg?.type === "bar_code/scan") scanOpen(msg.payload || {});
    else if (msg?.type === "bar_code/close") scanClose();
    else if (msg?.type === "bar_code/notify") scanNote(msg.payload?.message || "");
  },
};
const toCard = (command, payload) => EXT.receiveMessage({ type: "command", command, payload });
let scan = null;
let zxingLoad = null;
function loadZxing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  return zxingLoad || (zxingLoad = new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = BASE + "zxing.min.js?v=" + VERSION;
    s.onload = () => (window.ZXing ? ok(window.ZXing) : fail(new Error("zxing")));
    s.onerror = () => { zxingLoad = null; fail(new Error("zxing")); };
    document.head.append(s);
  }));
}
async function makeReader() {
  if ("BarcodeDetector" in window) {
    try {
      const have = await BarcodeDetector.getSupportedFormats();
      const formats = FORMATS.filter((f) => have.includes(f));
      if (formats.includes("ean_13") && formats.includes("aztec")) { // ohne Aztec lieber ZXing (z. B. Penny-Code)
        const det = new BarcodeDetector({ formats });
        return async (video) => { const r = await det.detect(video); return r[0] ? { rawValue: r[0].rawValue, format: r[0].format } : null; };
      }
    } catch (_) { /* dann eben ZXing */ }
  }
  const Z = await loadZxing();
  const reader = new Z.MultiFormatReader();
  const F = Z.BarcodeFormat;
  const hints = new Map([[Z.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE, F.AZTEC]], [Z.DecodeHintType.TRY_HARDER, true]]);
  reader.setHints(hints);
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const names = { [F.EAN_13]: "ean_13", [F.EAN_8]: "ean_8", [F.UPC_A]: "upc_a", [F.UPC_E]: "upc_e", [F.CODE_128]: "code_128", [F.CODE_39]: "code_39", [F.ITF]: "itf", [F.QR_CODE]: "qr_code", [F.AZTEC]: "aztec" };
  let n = 0;
  return async (video) => {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return null;
    // reihum: Mitte-Streifen (Strichcodes), ganzes Bild, großes und kleines Quadrat (QR/Aztec, z. B. auf einem Handy-Bildschirm)
    const m = Math.min(w, h);
    const wins = [[w * 0.05, h * 0.25, w * 0.9, h * 0.5], [0, 0, w, h], [(w - m * 0.8) / 2, (h - m * 0.8) / 2, m * 0.8, m * 0.8], [(w - m * 0.5) / 2, (h - m * 0.5) / 2, m * 0.5, m * 0.5]];
    const [x, y, cw, ch] = wins[n++ % wins.length];
    const scale = Math.min(2, 900 / Math.max(cw, ch));
    canvas.width = Math.round(cw * scale); canvas.height = Math.round(ch * scale);
    ctx.drawImage(video, x, y, cw, ch, 0, 0, canvas.width, canvas.height);
    try {
      const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(canvas)));
      const r = reader.decodeWithState(bmp);
      return { rawValue: r.getText(), format: names[r.getBarcodeFormat()] || "unknown" };
    } catch (_) { return null; } finally { reader.reset(); }
  };
}
async function scanOpen(p) {
  scanClose(true);
  const el = document.createElement("div");
  el.className = "scan";
  el.innerHTML = `<video playsinline muted autoplay></video><div class="shade"></div>
    <div class="top"><h2></h2><p></p></div><div class="msg"></div>
    <div class="btns">${p.alternative_option_label ? `<button class="main" data-b="alt"></button>` : ""}<button data-b="flip" title="${T("Kamera wechseln", "Switch camera")}">🔄</button><button data-b="x">✕ ${T("Schließen", "Close")}</button></div>`;
  el.querySelector("h2").textContent = p.title || T("Barcode scannen", "Scan barcode");
  el.querySelector(".top p").textContent = p.description || "";
  const alt = el.querySelector('[data-b="alt"]');
  if (alt) alt.textContent = p.alternative_option_label;
  document.body.append(el);
  const me = scan = { el, stream: null, timer: null, last: { code: null, at: 0 }, noteTimer: null };
  el.querySelector('[data-b="x"]').onclick = () => { scanClose(); toCard("bar_code/aborted", { reason: "canceled" }); };
  if (alt) alt.onclick = () => { scanClose(); toCard("bar_code/aborted", { reason: "alternative_options" }); };
  if (!history.state?.elScan) history.pushState({ elScan: 1 }, ""); // Zurück-Taste am Handy schließt den Scanner
  try {
    me.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
  } catch (err) {
    if (scan !== me) return;
    scanNote(err?.name === "NotAllowedError"
      ? T("📷 Die Kamera ist nicht erlaubt. Bitte in den Browser-Einstellungen für diese Seite erlauben.", "📷 Camera not allowed. Please allow it for this page in the browser settings.")
      : T("📷 Keine Kamera gefunden.", "📷 No camera found."), true);
    return;
  }
  if (scan !== me) { me.stream.getTracks().forEach((t) => t.stop()); return; }
  const video = el.querySelector("video");
  video.srcObject = me.stream;
  try { await video.play(); } catch (_) { /* startet trotzdem */ }
  // 🔄 Vorder-/Rückkamera wechseln: erst die laufende aus (viele Handys erlauben nur eine), dann die andere suchen
  let facing = "environment";
  el.querySelector('[data-b="flip"]').onclick = async () => {
    const md = navigator.mediaDevices;
    const oldId = me.stream?.getVideoTracks()[0]?.getSettings?.().deviceId;
    let cams = [];
    try { cams = (await md.enumerateDevices()).filter((d) => d.kind === "videoinput"); } catch (_) { /* egal */ }
    me.stream?.getTracks().forEach((t) => t.stop());
    const want = facing === "user" ? "environment" : "user";
    const isFront = (c) => /front|user|vorder|selfie/i.test(c.label || "");
    const other = cams.filter((c) => c.deviceId && c.deviceId !== oldId);
    const pick = other.find((c) => (want === "user" ? isFront(c) : c.label && !isFront(c))) || other[0];
    const tries = [...(pick ? [{ deviceId: { exact: pick.deviceId } }] : []), { facingMode: { exact: want } }, { facingMode: want }];
    let next = null;
    for (const video of tries) {
      try {
        const st = await md.getUserMedia({ audio: false, video: { ...video, width: { ideal: 1280 }, height: { ideal: 720 } } });
        const got = st.getVideoTracks()[0]?.getSettings?.() || {};
        if (got.deviceId && got.deviceId === oldId && cams.length > 1) { st.getTracks().forEach((t) => t.stop()); continue; }
        next = st; facing = got.facingMode || want; break;
      } catch (_) { /* nächster Versuch */ }
    }
    if (!next) {
      scanNote(T("📷 Nur eine Kamera gefunden.", "📷 Only one camera found."));
      try { next = await md.getUserMedia({ audio: false, video: oldId ? { deviceId: { exact: oldId } } : { facingMode: facing } }); } catch (_) { return; }
    }
    if (scan !== me) { next.getTracks().forEach((t) => t.stop()); return; }
    me.stream = next;
    video.srcObject = next;
    try { await video.play(); } catch (_) { /* egal */ }
  };
  let read;
  try { read = await makeReader(); } catch (_) {
    scanNote(T("⚠️ Der Barcode-Leser konnte nicht geladen werden – einmal mit Netz öffnen.", "⚠️ The barcode reader could not be loaded – open the app once with a connection."), true);
    return;
  }
  const tick = async () => {
    if (scan !== me) return;
    let hit = null;
    try { hit = await read(video); } catch (_) { /* nächstes Bild */ }
    if (scan !== me) return;
    // gleiche Packung bleibt im Bild? Erst wieder melden, wenn sie 2,5 Sekunden weg war
    if (hit?.rawValue && hit.rawValue === me.last.code && Date.now() - me.last.at < 2500) me.last.at = Date.now();
    else if (hit?.rawValue) {
      me.last = { code: hit.rawValue, at: Date.now() };
      navigator.vibrate?.(40);
      const shade = el.querySelector(".shade");
      shade.classList.add("hit"); setTimeout(() => shade.classList.remove("hit"), 600);
      toCard("bar_code/scan_result", hit);
    }
    me.timer = setTimeout(tick, 120);
  };
  tick();
}
function scanNote(text, stay = false) {
  if (!scan) return;
  const m = scan.el.querySelector(".msg");
  m.textContent = text;
  clearTimeout(scan.noteTimer);
  if (!stay) scan.noteTimer = setTimeout(() => { if (m.textContent === text) m.textContent = ""; }, 3000);
}
function scanClose(quiet) {
  if (!scan) return;
  const s = scan;
  scan = null;
  clearTimeout(s.timer); clearTimeout(s.noteTimer);
  s.stream?.getTracks().forEach((t) => t.stop());
  s.el.remove();
  // Zurück-Eintrag erst wegräumen, wenn nicht gleich der nächste Scanner aufgeht (z. B. „Mehrere scannen“)
  if (!quiet) setTimeout(() => { if (!scan && history.state?.elScan) { ignorePop = true; history.back(); } }, 50);
}
let ignorePop = false;
window.addEventListener("popstate", () => {
  if (ignorePop) { ignorePop = false; return; }
  if (scan) { scanClose(true); toCard("bar_code/aborted", { reason: "canceled" }); return; }
  if (history.state?.elGuard || history.state?.elScan) return;
  // ↩️ Zurück gedrückt: einen Schritt zurück in der Karte (Fenster zu, Einstellungen hoch, Laden-Modus aus …)
  if (card?.einkaufslisteBack?.()) setTimeout(syncGuard, 60);
});

// ↩️ Zurück-Taste am Handy: Solange in der Karte etwas „offen“ ist, liegt ein Merkzettel im Verlauf.
// Zurück nimmt den Merkzettel weg und geht einen Schritt zurück. Ist nichts mehr offen, geht die App zu.
let guardTimer = null;
function syncGuard() {
  guardTimer = null;
  if (!card || scan || !card.einkaufslisteIsRoot) return;
  const open = !card.einkaufslisteIsRoot();
  const st = history.state;
  if (open && !st?.elGuard && !st?.elScan) history.pushState({ elGuard: 1 }, "");
  else if (!open && st?.elGuard) { ignorePop = true; history.back(); }
}
const scheduleGuard = () => { if (!guardTimer) guardTimer = setTimeout(syncGuard, 80); };
window.addEventListener("einkaufsliste-nav", scheduleGuard);
new MutationObserver(scheduleGuard).observe(document.body, { childList: true });

// ---------------------------------------------------------------- 🏠 „Home Assistant“ für die Karte
function makeHass() {
  return {
    connected: ready,
    language: EN ? "en" : "de",
    locale: { language: EN ? "en" : "de" },
    user: user || { id: "", name: "", is_admin: false },
    states,
    auth: { external: EXT.config.hasBarCodeScanner ? EXT : undefined },
    async callWS(msg) {
      const plain = { ...msg };
      if (ready) {
        try {
          const res = await raw(plain);
          if (READ_CACHE.has(plain.type)) cachePut(plain, res);
          return res;
        } catch (err) {
          if (err.code !== "lost" || !READ_CACHE.has(plain.type)) throw err;
        }
      }
      if (READ_CACHE.has(plain.type)) { const hit = await cacheGet(plain); if (hit !== undefined) return hit; }
      throw { code: "lost", message: T("📴 Ohne Netz geht das gerade nicht", "📴 That needs a connection") };
    },
    connection: {
      async subscribeMessage(cb, msg) {
        const key = "s" + msgId++;
        const s = { msg, onEvent: (data) => { if (msg.type === "einkaufsliste/subscribe") { lastData = data; put(K.data, data); } cb(data); } };
        subs.set(key, s);
        if (msg.type === "einkaufsliste/subscribe" && lastData) setTimeout(() => cb(lastData), 0); // letzter Stand sofort – auch ohne Netz
        if (ready) sendSub(s);
        return () => { subs.delete(key); if (ready && s.serverId) raw({ type: "unsubscribe_events", subscription: s.serverId }).catch(() => {}); };
      },
    },
    async fetchWithAuth(url, opts = {}) {
      const token = await accessToken();
      return fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + token } });
    },
  };
}

// ---------------------------------------------------------------- 🖼️ Seite
let card = null;
function toast(msg) {
  document.querySelectorAll("body > .toast").forEach((t) => t.remove());
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.body.append(el); setTimeout(() => el.remove(), 3500);
}
window.addEventListener("hass-notification", (e) => toast(e.detail?.message || ""));
function update() {
  const wrap = document.getElementById("wrap");
  if (!auth) {
    card = null;
    wrap.innerHTML = `<div class="login"><img src="icon-192.png" alt=""><h1>${T("Einkaufsliste", "Shopping list")}</h1>
      <p>${T("Einmal mit deinem Home-Assistant-Benutzer anmelden. Danach funktioniert die Liste auch ohne Netz.", "Log in once with your Home Assistant user. After that the list also works without a connection.")}</p>
      ${navigator.onLine === false ? `<p class="small">${T("Zum ersten Anmelden braucht es einmal Netz.", "The first login needs a connection once.")}</p>`
        : `<button class="big" id="loginBtn">${T("Anmelden", "Log in")}</button>`}
      <p class="small">${T("Tipp: Im Browser-Menü „Zum Startbildschirm hinzufügen“ – dann hast du ein eigenes Symbol.", "Tip: use “Add to Home screen” in the browser menu to get an app icon.")}</p></div>`;
    document.getElementById("loginBtn")?.addEventListener("click", startLogin);
    return;
  }
  if (!customElements.get("einkaufsliste-card")) {
    if (!wrap.querySelector(".loading")) wrap.innerHTML = `<p class="small loading" style="text-align:center;margin-top:30vh">⏳ ${T("Lade …", "Loading …")}</p>`;
    return;
  }
  if (!card) {
    wrap.innerHTML = `<div class="bar"><span class="pill" id="pill"></span><span class="grow"></span><span>v${VERSION}</span></div>`;
    card = document.createElement("einkaufsliste-card");
    card.setConfig({ title: "Einkaufsliste" });
    wrap.append(card);
    // 🚪 Abmelden ganz unten – damit man beim Abhaken nicht aus Versehen draufkommt
    const foot = document.createElement("div");
    foot.className = "foot";
    foot.innerHTML = `<button id="guideBtn">${T("📖 Anleitung", "📖 Guide")}</button><button id="logoutBtn">${T("Abmelden", "Log out")}</button>`;
    wrap.append(foot);
    // 🚪 Abmelden nur unten in der Einkaufsliste und auf der ersten Seite der Einstellungen
    const showFoot = () => { foot.hidden = !(card._view === "list" || (card._view === "settings" && !card._setSec)); };
    window.addEventListener("einkaufsliste-nav", () => setTimeout(showFoot, 0));
    showFoot();
    document.getElementById("guideBtn").addEventListener("click", () => card._showGuide?.());
    document.getElementById("logoutBtn").addEventListener("click", () => {
      if (confirm(T("Abmelden? Noch nicht gesendete Änderungen gehen verloren.", "Log out? Changes not sent yet will be lost."))) logout(false);
    });
  }
  runShortcut();
  const pill = document.getElementById("pill");
  pill.textContent = ready ? T("🟢 verbunden", "🟢 connected") : T("📴 offline – letzter Stand", "📴 offline – last state");
  pill.classList.toggle("off", !ready);
  card.hass = makeHass();
}
// 📱 Schnellmenü am App-Symbol (lange drücken): ?do=add | shop | scan
let shortcut = new URLSearchParams(location.search).get("do");
if (shortcut) history.replaceState(null, "", BASE);
let shortcutTries = 0;
function runShortcut() {
  if (!shortcut || !card) return;
  if (!card._data || !card.shadowRoot) { if (shortcutTries++ < 30) setTimeout(runShortcut, 300); return; }
  const what = shortcut;
  shortcut = null;
  setTimeout(() => {
    const $ = (id) => card.shadowRoot.getElementById(id);
    if (what === "add") { $("inName")?.focus(); $("inName")?.scrollIntoView({ block: "center" }); }
    else if (what === "shop" && !$("btnShop")?.classList.contains("on")) $("btnShop")?.click();
    else if (what === "scan" && !$("btnScan")?.hidden) $("btnScan")?.click();
  }, 300);
}
function logout(silent) {
  const refresh = auth?.refresh;
  auth = null;
  localStorage.removeItem(K.auth);
  kvDel("auth");
  if (!silent) {
    for (const k of [K.data, K.user, K.states, "einkaufsliste_queue"]) localStorage.removeItem(k);
    kvDel("queue"); kvDel("auth"); kvDel("flushed");
    lastData = null; user = null; states = {};
    caches.delete("einkaufsliste-daten").catch(() => {});
    if (refresh) fetch("/auth/token", { method: "POST", body: new URLSearchParams({ action: "revoke", token: refresh }) }).catch(() => {});
  }
  try { ws?.close(); } catch (_) { /* egal */ }
  subs.clear();
  update();
}

(async () => {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register(BASE + "sw.js", { scope: BASE }).catch(() => {});
  try { await finishLogin(); } catch (_) { toast(T("Anmeldung hat nicht geklappt 🙈", "Login failed 🙈")); }
  try { // 🔄 Warteschlange abgleichen, bevor die Karte startet
    const q = await queueFromStore();
    if (q) localStorage.setItem(QKEY, JSON.stringify(q));
    else kvSet("queue", JSON.parse(localStorage.getItem(QKEY) || "[]"));
    if (auth) kvSet("auth", { ...auth, client_id: CLIENT_ID });
  } catch (_) { /* egal */ }
  const s = document.createElement("script");
  s.type = "module";
  s.src = "/einkaufsliste_files/einkaufsliste-card.js?v=" + VERSION;
  s.onload = () => customElements.whenDefined("einkaufsliste-card").then(update);
  document.head.append(s);
  update();
  connect();
})();
</script>
