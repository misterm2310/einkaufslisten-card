<!doctype html>
<!-- 🎫 Gast-Seite der Einkaufsliste: enthält nur Programm, keine Daten. Die Liste gibt es erst mit Schlüssel (hinter „#“) und PIN. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Einkaufsliste</title>
<style>
:root { --bg:#f5f5f5; --card:#fff; --text:#212121; --muted:#727272; --line:rgba(127,127,127,.25); --primary:#03a9f4; --ok:#43a047; --warn:#ef6c00; --err:#db4437; }
@media (prefers-color-scheme: dark) { :root { --bg:#111; --card:#1c1c1c; --text:#e1e1e1; --muted:#9b9b9b; --line:rgba(255,255,255,.14); } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width:560px; margin:0 auto; padding:16px; }
.card { background:var(--card); border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.12); padding:16px; }
h1 { font-size:1.25em; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
.sub { color:var(--muted); font-size:.9em; margin:0 0 12px; }
.pin { display:flex; gap:8px; margin:12px 0 4px; }
input { flex:1; min-width:0; font:inherit; font-size:1.3em; letter-spacing:.3em; text-align:center; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); }
button { font:inherit; cursor:pointer; border:1.5px solid color-mix(in srgb, var(--primary) 55%, transparent); background:transparent; color:var(--text); border-radius:999px; padding:8px 16px; }
button.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
.msg { min-height:1.4em; font-size:.92em; color:var(--err); margin:6px 0 0; }
.store { margin:14px 0 4px; font-weight:600; display:flex; align-items:center; gap:8px; }
.store .dot { width:9px; height:9px; border-radius:50%; background:var(--c, var(--primary)); }
.item { display:flex; align-items:center; gap:12px; padding:10px 4px; border-top:1px solid var(--line); cursor:pointer; -webkit-tap-highlight-color:transparent; }
.item .chk { flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:2px solid var(--muted); display:grid; place-items:center; color:#fff; font-size:15px; }
.item.done .chk { background:var(--ok); border-color:var(--ok); }
.item.done .nm { text-decoration:line-through; color:var(--muted); }
.item .nm { flex:1; min-width:0; overflow-wrap:anywhere; }
.item .q { color:var(--primary); font-weight:600; margin-right:4px; }
.item .note { display:block; color:var(--muted); font-size:.85em; }
.empty { color:var(--muted); text-align:center; padding:20px 0 8px; }
.foot { color:var(--muted); font-size:.82em; text-align:center; margin-top:14px; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1><span aria-hidden="true">🛒</span><span id="title">Einkaufsliste</span></h1>
    <p class="sub" id="sub">Gast-Zugang</p>
    <section id="login">
      <p id="ask">Bitte die PIN eingeben, die du bekommen hast.</p>
      <div class="pin"><input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]*" aria-label="PIN"><button class="primary" id="go">OK</button></div>
      <p class="msg" id="msg" role="alert"></p>
    </section>
    <section id="list" hidden></section>
  </div>
  <p class="foot" id="foot"></p>
</main>
<script src="gast.js"></script>
</body>
</html>
